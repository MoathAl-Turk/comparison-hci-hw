<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is crucial for mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCI Assignment 1 - AI Websites</title>
    <style>
        /* Ensures padding doesn't push the container off-screen */
        * {
            box-sizing: border-box;
        }

        /* Animated Coffee Brown Background */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #2b1408, #5c3a21, #8b5a2b, #3d1c00);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Sleek black container */
        .container {
            background: rgba(0, 0, 0, 0.75); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            width: 90%; /* Leaves a nice margin on mobile screens */
            color: white; 
        }

        h1 { margin-top: 0; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p { margin-bottom: 25px; line-height: 1.5; color: #ccc; }

        .links { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        /* Glassy Interactive Buttons */
        a { 
            text-decoration: none; 
            padding: 15px 20px; 
            background: rgba(255, 255, 255, 0.15); 
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px; 
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease; 
            width: 100%; /* Makes buttons fill the available space nicely */
        }

        a:hover { 
            background: rgba(255, 255, 255, 0.25); 
            transform: translateY(-3px); 
            box-shadow: 0 7px 15px rgba(0,0,0,0.5); 
            border-color: #d2a679; 
        }
        
        a:active {
            transform: translateY(1px); 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px; /* Reduces padding to save space */
                width: 92%;
            }
            h1 {
                font-size: 22px; /* Scales down header */
            }
            p {
                font-size: 14px;
            }
            a {
                padding: 12px 15px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI-Generated Web Interfaces</h1>
        <p>Select a tool below to view its generated webpage in a new tab:</p>
        
        <div class="links">
            <a href="google.html" target="_blank" rel="noopener noreferrer">Google AI Studio</a>
            <a href="chatgbt.html" target="_blank" rel="noopener noreferrer">ChatGPT</a>
            <a href="claude.html" target="_blank" rel="noopener noreferrer">Claude</a>
        </div>
    </div>
</body>
</html>
